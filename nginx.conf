server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index render.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # paperlesspaper fetches the manifest and render page from its own origin.
    add_header Access-Control-Allow-Origin * always;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true}';
    }

    # Olaii's API sends no CORS headers, so the render page fetches it through us.
    # Query string (e.g. ?limit=4) is passed through unchanged.
    location = /api/data {
        rewrite ^ /api/v2/events/ break;
        proxy_pass https://ticketing.olaii.com;
        proxy_set_header Host ticketing.olaii.com;
        proxy_ssl_server_name on;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin * always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300" always;
        add_header Access-Control-Allow-Origin * always;
    }
}
